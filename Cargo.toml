[package]
name = "soroban-sdk-codegen"
version = "0.1.0"
edition = "2021"
authors = ["OrderStream <healthdecoded77@gmail.com>"]
description = "Multi-language client SDK generator CLI for Stellar Soroban: generates type-safe TypeScript and Python client SDKs from contract specs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/OrderStream/soroban-sdk-codegen"
readme = "README.md"
keywords = ["stellar", "soroban", "sdk", "codegen", "typescript"]

[[bin]]
name = "soroban-sdk-codegen"
path = "src/main.rs"

[lib]
name = "soroban_sdk_codegen"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
